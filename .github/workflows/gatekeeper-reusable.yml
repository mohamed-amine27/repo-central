name: 🚦 Gatekeeper Reusable (SonarCloud)

# ════════════════════════════════════════════════════════════
# Gatekeeper avec SonarCloud (pas besoin de ngrok)
# Scan PR incrémental + Cache massif
# Durée moyenne : 30s-1min après premier run
# ════════════════════════════════════════════════════════════

on:
  workflow_call:
    inputs:
      project_key:
        required: true
        type: string
      branch:
        required: false
        default: "main"
        type: string
      python_version:
        required: false
        default: "3.10"
        type: string

    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_ORGANIZATION:
        required: true
      SAMBANOVA_API_KEY:
        required: true

    outputs:
      decision:
        value: ${{ jobs.gatekeeper.outputs.decision }}
      violations_count:
        value: ${{ jobs.gatekeeper.outputs.violations_count }}

jobs:
  gatekeeper:
    name: 🚦 Quality Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 6

    outputs:
      decision:         ${{ steps.gate.outputs.decision }}
      violations_count: ${{ steps.gate.outputs.violations_count }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          path:        project_code
          fetch-depth: 0

      - name: 📥 Checkout repo-central
        uses: actions/checkout@v4
        with:
          repository: mohamed-amine27/repo-central
          path:       repo-central
          token:      ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: repo-central/requirements.txt

      - name: 💾 Cache SonarScanner & npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.sonar
            ~/.npm-global
          key: ${{ runner.os }}-sonarcloud-v1

      - name: 📦 Install Python deps
        run: pip install -r repo-central/requirements.txt

      - name: 🔧 Install sonar-scanner + MCP
        run: |
          npm config set prefix '~/.npm-global'
          npm install -g sonarqube-scanner sonarqube-api-mcp
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      # ── Scan SonarCloud (action officielle) ───────────────
      - name: 🔍 SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: project_code
          args: >
            -Dsonar.projectKey=${{ inputs.project_key }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

      - name: ⏳ Wait indexation
        run: sleep 8

      - name: 🚦 Run Gatekeeper
        id:   gate
        timeout-minutes: 3
        env:
          SONAR_TOKEN:        ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL:     "https://sonarcloud.io"
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SAMBANOVA_API_KEY:  ${{ secrets.SAMBANOVA_API_KEY }}
          CI:                 "true"
          GITHUB_ACTIONS:     "true"
        run: |
          cd repo-central/agent_ci
          python agent_gatekeeper.py \
            ${{ inputs.project_key }} \
            --path ${{ github.workspace }}/project_code \
            --branch ${{ inputs.branch || github.head_ref }}

          cp gatekeeper_report.json ${{ github.workspace }}/gatekeeper_report.json
          cd ${{ github.workspace }}

          DECISION=$(python -c "import json; print(json.load(open('gatekeeper_report.json'))['decision'])")
          VIOLATIONS=$(python -c "import json; print(len(json.load(open('gatekeeper_report.json'))['violations']))")

          echo "decision=$DECISION"           >> $GITHUB_OUTPUT
          echo "violations_count=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "✅ Decision: $DECISION | Violations: $VIOLATIONS"

      - name: 📊 Gate Summary
        if: always()
        run: |
          if [ -f gatekeeper_report.json ]; then
            DECISION=$(python -c "import json; print(json.load(open('gatekeeper_report.json'))['decision'])")

            echo "## 🚦 Gatekeeper — ${{ inputs.project_key }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$DECISION" = "PASS" ]; then
              echo "### ✅ MERGE AUTORISÉ" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ MERGE BLOQUÉ" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Violations :**" >> $GITHUB_STEP_SUMMARY
              python -c "
          import json
          r = json.load(open('gatekeeper_report.json'))
          for v in r['violations']:
              print(f\"- [{v['category']}] {v['message']}\")
          " >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Métriques :**" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python -c "import json; print(json.dumps(json.load(open('gatekeeper_report.json'))['summary'], indent=2))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-${{ inputs.project_key }}-${{ github.run_number }}
          path: gatekeeper_report.json